# Keeps a free Supabase project from pausing (it pauses after ~7 days without activity).
# Pings /api/health, which does a tiny read on site_settings.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   SITE_URL = https://your-domain.com   (no trailing slash)
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 5 */3 * *" # every 3 days, 05:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::Add the SITE_URL repository secret (e.g. https://your-domain.com)"
            exit 0
          fi
          for attempt in 1 2 3; do
            body=$(curl -fsS --max-time 30 "${SITE_URL%/}/api/health") && { echo "$body"; exit 0; }
            echo "Attempt $attempt failed, retrying in 20s…"
            sleep 20
          done
          echo "::error::Health check failed after 3 attempts"
          exit 1
